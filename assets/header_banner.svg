<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>

    <!-- Glowing Orbs Gradients -->
    <radialGradient id="cyanGlow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#4facfe" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0a0d14" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purpleGlow" cx="85%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0a0d14" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="emeraldGlow" cx="50%" cy="95%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#059669" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0a0d14" stop-opacity="0"/>
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#E0F2FE"/>
      <stop offset="70%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E879F9"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.07)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>

  <!-- Radial Glow Lighting -->
  <rect width="1200" height="360" rx="16" fill="url(#cyanGlow)"/>
  <rect width="1200" height="360" rx="16" fill="url(#purpleGlow)"/>
  <rect width="1200" height="360" rx="16" fill="url(#emeraldGlow)"/>

  <!-- Cyber Grid Lines Background (Subtle) -->
  <g stroke="rgba(255, 255, 255, 0.04)" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>

    <line x1="150" y1="0" x2="150" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="450" y1="0" x2="450" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="750" y1="0" x2="750" y2="360"/>
    <line x1="900" y1="0" x2="900" y2="360"/>
    <line x1="1050" y1="0" x2="1050" y2="360"/>
  </g>

  <!-- Border Frame Accent -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5"/>

  <!-- Top Accent Neon Bar -->
  <path d="M 0 16 C 0 7.16 7.16 0 16 0 L 1184 0 C 1192.84 0 1200 7.16 1200 16 L 1200 4 L 0 4 Z" fill="url(#cyanBlueGrad)"/>

  <!-- ==================== RIGHT SIDE: TECH / AI NETWORK VISUAL ==================== -->
  <g transform="translate(980, 180)">
    <!-- Outer Orbit Ring -->
    <circle r="125" fill="none" stroke="rgba(168, 85, 247, 0.2)" stroke-width="1.5" stroke-dasharray="6 8"/>
    <circle r="95" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5"/>
    <circle r="65" fill="none" stroke="rgba(34, 211, 238, 0.35)" stroke-width="1" stroke-dasharray="4 6"/>
    <circle r="35" fill="rgba(56, 189, 248, 0.08)" stroke="rgba(56, 189, 248, 0.5)" stroke-width="2"/>
    
    <!-- Central AI Core Node -->
    <circle r="16" fill="#38BDF8" filter="url(#glowFilter)"/>
    <circle r="8" fill="#FFFFFF"/>

    <!-- Neural Network Node Links -->
    <line x1="0" y1="0" x2="60" y2="-45" stroke="rgba(56, 189, 248, 0.5)" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="-70" y2="-55" stroke="rgba(168, 85, 247, 0.5)" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="80" y2="40" stroke="rgba(52, 211, 153, 0.5)" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="-65" y2="50" stroke="rgba(244, 114, 182, 0.5)" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="-20" y2="-90" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1"/>
    <line x1="0" y1="0" x2="35" y2="85" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1"/>

    <!-- Interconnected Outer Links -->
    <line x1="60" y1="-45" x2="80" y2="40" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
    <line x1="-70" y1="-55" x2="-20" y2="-90" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1"/>
    <line x1="-65" y1="50" x2="35" y2="85" stroke="rgba(52, 211, 153, 0.3)" stroke-width="1"/>

    <!-- Satellite Nodes with Glow -->
    <circle cx="60" cy="-45" r="7" fill="#38BDF8" filter="url(#glowFilter)"/>
    <circle cx="-70" cy="-55" r="8" fill="#C084FC" filter="url(#glowFilter)"/>
    <circle cx="80" cy="40" r="7" fill="#34D399" filter="url(#glowFilter)"/>
    <circle cx="-65" cy="50" r="6" fill="#F472B6" filter="url(#glowFilter)"/>
    <circle cx="-20" cy="-90" r="5" fill="#38BDF8"/>
    <circle cx="35" cy="85" r="5" fill="#A855F7"/>

    <!-- Small Data Points -->
    <circle cx="110" cy="-10" r="3" fill="#38BDF8" opacity="0.8"/>
    <circle cx="-100" cy="15" r="3.5" fill="#C084FC" opacity="0.8"/>
    <circle cx="-35" cy="105" r="2.5" fill="#34D399" opacity="0.8"/>
    <circle cx="50" cy="-95" r="3" fill="#FCD34D" opacity="0.8"/>

    <!-- Orbiting Code / Data Glyphs -->
    <text x="68" y="-40" fill="#BAE6FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">AI / ML</text>
    <text x="-120" y="-55" fill="#E9D5FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">CV &amp; NLP</text>
    <text x="75" y="60" fill="#A7F3D0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">ETL / BI</text>
  </g>

  <!-- ==================== LEFT & CENTER CONTENT ==================== -->

  <!-- Top Pill: Status / Domain Badge -->
  <g transform="translate(60, 42)">
    <rect width="365" height="28" rx="14" fill="rgba(6, 182, 212, 0.12)" stroke="rgba(34, 211, 238, 0.4)" stroke-width="1"/>
    <circle cx="14" cy="14" r="5" fill="#22D3EE" filter="url(#glowFilter)"/>
    <text x="27" y="18" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">
      DATA SCIENTIST &amp; AI SPECIALIST
    </text>
  </g>

  <!-- Candidate Name -->
  <text x="60" y="118" fill="url(#nameGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="46" font-weight="900" letter-spacing="1">
    CHAITANYA MEDAM
  </text>

  <!-- Colorful Multi-Role Tagline -->
  <g transform="translate(60, 154)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" letter-spacing="0.5">
      <tspan fill="#38BDF8">DATA SCIENTIST</tspan>
      <tspan fill="#64748B" font-weight="400">  ✦  </tspan>
      <tspan fill="#C084FC">AI ENGINEER</tspan>
      <tspan fill="#64748B" font-weight="400">  ✦  </tspan>
      <tspan fill="#34D399">ML RESEARCHER</tspan>
      <tspan fill="#64748B" font-weight="400">  ✦  </tspan>
      <tspan fill="#F472B6">BI ARCHITECT</tspan>
    </text>
  </g>

  <!-- Short Impact Narrative -->
  <text x="60" y="185" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400">
    Transforming telemetry &amp; unstructured data into high-performance AI models, production ETL &amp; actionable BI intelligence.
  </text>

  <!-- ==================== HIGHLIGHT PILLS / STAT CARDS ==================== -->
  <g transform="translate(60, 212)">

    <!-- Card 1: Research Publications -->
    <g transform="translate(0, 0)" filter="url(#cardShadow)">
      <rect width="180" height="52" rx="10" fill="url(#cardGrad)" stroke="rgba(245, 158, 11, 0.45)" stroke-width="1.2"/>
      <circle cx="24" cy="26" r="12" fill="rgba(245, 158, 11, 0.15)"/>
      <text x="24" y="30" text-anchor="middle" font-size="14">📚</text>
      <text x="44" y="21" fill="url(#goldGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800">4x Research</text>
      <text x="44" y="38" fill="#FDE68A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="500">IEEE &amp; Scopus</text>
    </g>

    <!-- Card 2: Industry / Continental -->
    <g transform="translate(192, 0)" filter="url(#cardShadow)">
      <rect width="180" height="52" rx="10" fill="url(#cardGrad)" stroke="rgba(56, 189, 248, 0.45)" stroke-width="1.2"/>
      <circle cx="24" cy="26" r="12" fill="rgba(56, 189, 248, 0.15)"/>
      <text x="24" y="30" text-anchor="middle" font-size="14">🚗</text>
      <text x="44" y="21" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800">Continental</text>
      <text x="44" y="38" fill="#BAE6FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="500">Autonomous Mobility</text>
    </g>

    <!-- Card 3: ETL & Reliability -->
    <g transform="translate(384, 0)" filter="url(#cardShadow)">
      <rect width="180" height="52" rx="10" fill="url(#cardGrad)" stroke="rgba(16, 185, 129, 0.45)" stroke-width="1.2"/>
      <circle cx="24" cy="26" r="12" fill="rgba(16, 185, 129, 0.15)"/>
      <text x="24" y="30" text-anchor="middle" font-size="14">⚡</text>
      <text x="44" y="21" fill="url(#emeraldGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800">-60% Manual ETL</text>
      <text x="44" y="38" fill="#A7F3D0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="500">95% Reliability</text>
    </g>

    <!-- Card 4: Domains -->
    <g transform="translate(576, 0)" filter="url(#cardShadow)">
      <rect width="180" height="52" rx="10" fill="url(#cardGrad)" stroke="rgba(168, 85, 247, 0.45)" stroke-width="1.2"/>
      <circle cx="24" cy="26" r="12" fill="rgba(168, 85, 247, 0.15)"/>
      <text x="24" y="30" text-anchor="middle" font-size="14">🧠</text>
      <text x="44" y="21" fill="url(#purpleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800">CV &amp; GenAI</text>
      <text x="44" y="38" fill="#DDD6FE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="500">Deep Learning &amp; NLP</text>
    </g>

  </g>

  <!-- ==================== BOTTOM TECH BADGE PILLS ==================== -->
  <g transform="translate(60, 288)">
    <text x="0" y="22" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">CORE STACK:</text>
    
    <!-- Python -->
    <g transform="translate(90, 4)">
      <rect width="78" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="12" cy="13" r="4" fill="#38BDF8"/>
      <text x="24" y="17" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Python</text>
    </g>

    <!-- PyTorch -->
    <g transform="translate(176, 4)">
      <rect width="84" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="12" cy="13" r="4" fill="#EE4C2C"/>
      <text x="24" y="17" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">PyTorch</text>
    </g>

    <!-- TensorFlow -->
    <g transform="translate(268, 4)">
      <rect width="102" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="12" cy="13" r="4" fill="#FF6F00"/>
      <text x="24" y="17" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">TensorFlow</text>
    </g>

    <!-- OpenCV -->
    <g transform="translate(378, 4)">
      <rect width="84" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="12" cy="13" r="4" fill="#5C3EE8"/>
      <text x="24" y="17" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">OpenCV</text>
    </g>

    <!-- SQL -->
    <g transform="translate(470, 4)">
      <rect width="66" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="12" cy="13" r="4" fill="#4479A1"/>
      <text x="24" y="17" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">SQL</text>
    </g>

    <!-- Power BI -->
    <g transform="translate(544, 4)">
      <rect width="90" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="12" cy="13" r="4" fill="#F2C811"/>
      <text x="24" y="17" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Power BI</text>
    </g>

    <!-- Streamlit -->
    <g transform="translate(642, 4)">
      <rect width="90" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="12" cy="13" r="4" fill="#FF4B4B"/>
      <text x="24" y="17" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Streamlit</text>
    </g>

    <!-- Transformers -->
    <g transform="translate(740, 4)">
      <rect width="115" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="12" cy="13" r="4" fill="#FFD21E"/>
      <text x="24" y="17" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Transformers</text>
    </g>
  </g>

</svg>
